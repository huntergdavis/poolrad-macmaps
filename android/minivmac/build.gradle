plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        versionCode 168
        buildConfigField 'boolean', 'PERSONAL_PACKAGE', 'false'

        minSdkVersion 21
        targetSdkVersion 34

        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        personal {
            initWith debug
            matchingFallbacks = ['debug']
            signingConfig signingConfigs.debug
            versionNameSuffix '-personal'
            buildConfigField 'boolean', 'PERSONAL_PACKAGE', 'true'
        }
    }

    flavorDimensions = ['machine']
    productFlavors {
        macPlus {
            dimension 'machine'
            applicationId 'com.hunterdavis.poolradmacmaps.plus'
            versionName '0.102.0'

            externalNativeBuild {
                ndkBuild {
                    arguments "NDK_FLAVOR=macPlus"
                }
            }
        }

        macII {
            dimension 'machine'
            applicationId 'com.hunterdavis.poolradmacmaps.ii'
            versionName '0.102.0'

            externalNativeBuild {
                ndkBuild {
                    arguments "NDK_FLAVOR=macII"
                }
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/Android.mk'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    // Never attach private files to main/debug/release, even when the property is present.
    sourceSets.personal.assets.srcDir layout.buildDirectory.dir('generated/personalAssets')
    namespace 'name.osher.gil.minivmac'
}

androidComponents {
    beforeVariants(selector().withBuildType('personal')) { variant ->
        if (variant.productFlavors.any { it.second == 'macPlus' }) variant.enable = false
    }
}

def personalBundle = providers.gradleProperty('poolradPersonalBundle')
def personalSources = providers.gradleProperty('poolradPersonalSources')
def allowAssetFetch = providers.gradleProperty('poolradAllowAssetFetch')
def personalAssets = layout.buildDirectory.dir('generated/personalAssets')
def personalTool = rootProject.file('../tools/prepare-personal-package.py')
def fetchTool = rootProject.file('../tools/fetch-personal-assets.py')
File verifiedFetchedBundle = null
def fetchedPersonalBundle = {
    File config = file(personalSources.get())
    if (!config.isFile() || config.length() < 1 || config.length() > 65536)
        throw new GradleException('Personal source manifest is missing, empty or larger than 64 KiB. See docs/PERSONAL_ASSET_FETCH.md.')
    String digest = java.security.MessageDigest.getInstance('SHA-256').digest(config.bytes).encodeHex().toString()
    // Private inputs are deliberately outside build/, so clean does not force a download.
    file("private-assets/fetched/${digest}")
}
def resolvePersonalBundle = {
    if (personalBundle.isPresent() && personalSources.isPresent())
        throw new GradleException('Choose poolradPersonalBundle OR poolradPersonalSources, not both.')
    if (personalSources.isPresent()) return verifiedFetchedBundle ?: fetchedPersonalBundle()
    if (personalBundle.isPresent()) return file(personalBundle.get())
    throw new GradleException('Personal build requires -PpoolradPersonalBundle=/absolute/prepared/bundle or explicit poolradPersonalSources. See docs/PERSONAL_PACKAGE.md. Public builds need no private files.')
}
tasks.register('fetchPersonalAssets') {
    group = 'build setup'
    description = 'Explicitly fetch or verify pinned private ROM/disk inputs. Never publishes an APK.'
    // No up-to-date shortcut: each invocation re-verifies all cached payloads.
    doLast {
        if (!personalSources.isPresent())
            throw new GradleException('Asset fetching requires -PpoolradPersonalSources=/absolute/private/sources.json. No default download sources exist.')
        File destination = resolvePersonalBundle()
        if (allowAssetFetch.orElse('false').get() != 'true')
            throw new GradleException('Pass -PpoolradAllowAssetFetch=true to acknowledge private inputs/APKs. See docs/PERSONAL_ASSET_FETCH.md.')
        def arguments = ['python3', fetchTool, '--config', file(personalSources.get()),
                         '--output', destination, '--config-sha256', destination.name,
                         '--acknowledge-private-assets']
        if (gradle.startParameter.offline) arguments.add('--offline')
        exec { commandLine arguments }
        // Do not reselect another cache if the manifest is edited during this build.
        verifiedFetchedBundle = destination
    }
}
tasks.register('preparePersonalAssets') {
    dependsOn { personalSources.isPresent() ? ['fetchPersonalAssets'] : [] }
    inputs.file personalTool
    inputs.property 'bundlePath', personalBundle.orElse('')
    inputs.property 'sourcesPath', personalSources.orElse('')
    inputs.files {
        personalBundle.isPresent() || personalSources.isPresent() ? fileTree(resolvePersonalBundle()) : files()
    }
    outputs.dir personalAssets
    outputs.upToDateWhen { false }
    doLast {
        File source = resolvePersonalBundle().canonicalFile
        File destination = personalAssets.get().asFile.canonicalFile
        File expected = new File(layout.buildDirectory.get().asFile.canonicalFile, 'generated/personalAssets')
        if (destination != expected)
            throw new GradleException('Refusing a redirected generated personal-assets directory.')
        if (source.toPath().startsWith(destination.toPath()) || destination.toPath().startsWith(source.toPath()))
            throw new GradleException('Private input and generated output must be separate directories.')
        // Validate before removing only this task's disposable generated output.
        exec { commandLine 'python3', personalTool, 'verify', source }
        delete destination
        exec { commandLine 'python3', personalTool, 'stage', source, destination }
    }
}
tasks.matching { it.name == 'mergeMacIIPersonalAssets' }.configureEach {
    dependsOn 'preparePersonalAssets'
}

tasks.register('verifyRuneArtwork') {
    def artwork = file('src/main/assets/codewheel')
    inputs.dir artwork
    doLast {
        ['esp', 'det'].each { ring ->
            (1..36).each { id ->
                def image = new File(artwork, String.format('%s%02d.gif', ring, id))
                if (!image.isFile()) throw new GradleException("Missing bundled rune artwork: ${image}. Restore it from the repository.")
                byte[] data = image.bytes
                if (data.length < 10 || data.length > 32768 ||
                        !(new String(data, 0, 6, 'US-ASCII') in ['GIF87a', 'GIF89a']))
                    throw new GradleException("Invalid rune GIF: ${image}")
                int width = (data[6] & 255) | ((data[7] & 255) << 8)
                int height = (data[8] & 255) | ((data[9] & 255) << 8)
                if (width < 1 || width > 256 || height < 1 || height > 256)
                    throw new GradleException("Invalid rune dimensions: ${image}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyRuneArtwork' }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.android.support:multidex:1.0.3'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.7'
    implementation 'androidx.navigation:navigation-ui:2.8.7'
    implementation 'androidx.preference:preference:1.2.1'
}
